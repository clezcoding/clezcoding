<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">clez — build, automate, ship</title>
  <desc id="desc">A midnight terminal-inspired developer banner with a connected world, code panels, travel details, and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16" />
      <stop offset="0.48" stop-color="#0d1117" />
      <stop offset="1" stop-color="#151238" />
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="48%" r="55%">
      <stop offset="0" stop-color="#6b7cff" stop-opacity=".25" />
      <stop offset=".55" stop-color="#7c3aed" stop-opacity=".09" />
      <stop offset="1" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7cff" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="rounded"><rect width="1400" height="420" rx="24" /></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #8b949e; }
    .bright { fill: #f0f6fc; }
    .purple { fill: #a78bfa; }
    .cyan { fill: #22d3ee; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    .dash { stroke-dasharray: 7 10; animation: travel 12s linear infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes blink { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.88) } 50% { opacity: 1; transform: scale(1.15) } }
    @keyframes travel { to { stroke-dashoffset: -170 } }
    @keyframes scan { 0% { transform: translateY(-30px); opacity: 0 } 10% { opacity: .45 } 80% { opacity: .1 } 100% { transform: translateY(430px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .dash, .scan { animation: none; } }
  </style>

  <g clip-path="url(#rounded)">
    <rect width="1400" height="420" fill="url(#bg)" />
    <rect width="1400" height="420" fill="url(#glow)" />
    <g opacity=".16" stroke="#6e7681" stroke-width="1">
      <path d="M0 70H1400M0 140H1400M0 210H1400M0 280H1400M0 350H1400" />
      <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420M1200 0V420M1300 0V420" />
    </g>

    <!-- ambient stars -->
    <g fill="#a5b4fc" opacity=".45">
      <circle cx="68" cy="54" r="1.5"/><circle cx="182" cy="92" r="1"/><circle cx="352" cy="47" r="1.2"/>
      <circle cx="548" cy="77" r="1"/><circle cx="1272" cy="56" r="1.3"/><circle cx="1328" cy="112" r="1"/>
      <circle cx="1184" cy="342" r="1.4"/><circle cx="90" cy="364" r="1"/><circle cx="616" cy="368" r="1.1"/>
    </g>

    <!-- left identity -->
    <text class="mono muted" x="68" y="90" font-size="17">~/somewhere-on-earth</text>
    <text class="sans bright" x="64" y="166" font-size="62" font-weight="800" letter-spacing="-2">clez</text>
    <rect x="66" y="187" width="330" height="4" rx="2" fill="url(#line)" />
    <text class="mono bright" x="68" y="233" font-size="20">build · automate · ship</text>
    <text class="mono muted" x="68" y="275" font-size="15">TypeScript-first products</text>
    <text class="mono muted" x="68" y="301" font-size="15">AI-native developer tools</text>
    <text class="mono muted" x="68" y="327" font-size="15">self-hosted infrastructure</text>
    <text class="mono purple" x="68" y="372" font-size="14">$ status --sleep</text>
    <text class="mono bright" x="225" y="372" font-size="14">beta</text>
    <rect class="cursor" x="262" y="358" width="9" height="18" rx="1" fill="#22d3ee" />

    <!-- connected world -->
    <g transform="translate(720 64)">
      <path d="M38 82l36-31 64-12 42 16 44-8 52 20 29 35-21 26-53-4-38 18-29-20-48 6-36-19z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <path d="M330 58l48-20 73 8 34 26-18 22-52 3-23 25-49-8-31-28z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <path d="M188 158l38 3 27 32-8 53-25 47-19-17 8-43-24-34z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <path d="M437 155l35 16 13 34-31 22-28-17 2-34z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <path d="M301 106C239 31 156 31 105 79M301 106C358 53 405 52 439 76M301 106C349 129 392 158 450 191M301 106C279 164 248 194 225 236" fill="none" stroke="url(#line)" stroke-width="2" opacity=".75" class="dash" />
      <g filter="url(#softGlow)">
        <circle class="pulse" cx="301" cy="106" r="5" fill="#22d3ee" />
        <circle cx="105" cy="79" r="4" fill="#a78bfa" />
        <circle cx="439" cy="76" r="4" fill="#a78bfa" />
        <circle cx="450" cy="191" r="4" fill="#22d3ee" />
        <circle cx="225" cy="236" r="4" fill="#22d3ee" />
      </g>
      <text class="mono muted" x="20" y="316" font-size="12">lat: variable</text>
      <text class="mono muted" x="148" y="316" font-size="12">lon: variable</text>
      <text class="mono cyan" x="323" y="316" font-size="12">wifi: connected</text>
    </g>

    <!-- right terminal card -->
    <g transform="translate(1120 72)">
      <rect width="224" height="244" rx="14" fill="#0d1117" stroke="#30363d" />
      <rect width="224" height="38" rx="14" fill="#161b22" />
      <rect y="24" width="224" height="14" fill="#161b22" />
      <circle cx="18" cy="19" r="5" fill="#ff5f57" />
      <circle cx="35" cy="19" r="5" fill="#febc2e" />
      <circle cx="52" cy="19" r="5" fill="#28c840" />
      <text class="mono muted" x="112" y="23" font-size="10" text-anchor="middle">3am.log</text>
      <text class="mono purple" x="18" y="72" font-size="12">$</text>
      <text class="mono bright" x="34" y="72" font-size="12">idea --new</text>
      <text class="mono muted" x="18" y="100" font-size="11">researching...</text>
      <text class="mono muted" x="18" y="124" font-size="11">planning...</text>
      <text class="mono muted" x="18" y="148" font-size="11">building...</text>
      <text class="mono cyan" x="18" y="172" font-size="11">edge case found</text>
      <text class="mono bright" x="18" y="196" font-size="11">fixing anyway</text>
      <text class="mono" x="18" y="222" font-size="11" fill="#22c55e">✓ shipped</text>
    </g>

    <rect class="scan" x="0" y="-20" width="1400" height="1" fill="#22d3ee" />
    <rect x="0.75" y="0.75" width="1398.5" height="418.5" rx="23" fill="none" stroke="#30363d" stroke-width="1.5" />
  </g>
</svg>
