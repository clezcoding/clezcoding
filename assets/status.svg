<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 72" role="img" aria-labelledby="title desc">
  <title id="title">What clez is currently building</title>
  <desc id="desc">An animated status line cycling through TypeScript products, AI tooling, and self-hosted infrastructure.</desc>
  <style>
    .bg { fill: #0d1117; }
    .frame { fill: none; stroke: #30363d; stroke-width: 1; }
    .prompt { fill: #a78bfa; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .label { fill: #8b949e; font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .value { fill: #e6edf3; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; opacity: 0; }
    .one { animation: one 12s infinite; }
    .two { animation: two 12s infinite; }
    .three { animation: three 12s infinite; }
    .cursor { fill: #22d3ee; animation: blink 1.1s step-end infinite; }
    @keyframes one { 0%, 28% { opacity: 1 } 33%, 100% { opacity: 0 } }
    @keyframes two { 0%, 32% { opacity: 0 } 36%, 61% { opacity: 1 } 66%, 100% { opacity: 0 } }
    @keyframes three { 0%, 65% { opacity: 0 } 69%, 95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes blink { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .one { animation: none; opacity: 1; }
      .two, .three, .cursor { display: none; }
    }
  </style>
  <rect class="bg" width="840" height="72" rx="12" />
  <rect class="frame" x="0.5" y="0.5" width="839" height="71" rx="11.5" />
  <text class="prompt" x="24" y="43">$</text>
  <text class="label" x="45" y="43">clez --currently</text>
  <text class="value one" x="205" y="43">shipping TypeScript products</text>
  <text class="value two" x="205" y="43">connecting AI agents to real systems</text>
  <text class="value three" x="205" y="43">making self-hosting less painful</text>
  <rect class="cursor" x="803" y="28" width="9" height="19" rx="1" />
</svg>
